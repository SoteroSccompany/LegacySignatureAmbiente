# # Configurações de listeners para AMQP e Management Plugin
# listeners.tcp.default = 5672
# management.tcp.port = 15672
# management.tcp.ip = 0.0.0.0

# Habilita o usuário guest somente via localhost (por segurança)
loopback_users.guest = false

# Definições de memória e disco (ajuste conforme a necessidade)
vm_memory_high_watermark.relative = 0.75
disk_free_limit.relative = 0.2

# Clustering e Heartbeat
cluster_formation.peer_discovery_backend  = rabbit_peer_discovery_classic_config
cluster_partition_handling = autoheal
heartbeat = 30

# Logging
log.file.level = info
log.console.level = warning

