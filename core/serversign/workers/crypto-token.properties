# Crypto Worker PKCS#11 → SoftHSM2 (gestão de chaves).
# SHAREDLIBRARY (path absoluto) é usado porque o EAR da imagem CE só
# registra "P11 Proxy" em tempo de build — ver Dockerfile / README.
# Slot identificado por LABEL (não por número) — o ID numérico do SoftHSM
# muda a cada init e quebra SLOTLABELTYPE=SLOT_NUMBER.

WORKERGENID1.TYPE=CRYPTO_WORKER
WORKERGENID1.IMPLEMENTATION_CLASS=org.signserver.server.signers.CryptoWorker
WORKERGENID1.CRYPTOTOKEN_IMPLEMENTATION_CLASS=org.signserver.server.cryptotokens.PKCS11CryptoToken
WORKERGENID1.NAME=CryptoTokenSoftHSM

WORKERGENID1.SHAREDLIBRARY=/usr/lib64/pkcs11/libsofthsm2.so
WORKERGENID1.SLOTLABELTYPE=SLOT_LABEL
WORKERGENID1.SLOTLABELVALUE=${HSM_TOKEN_LABEL}

# Auto-ativação do token (PIN do SoftHSM).
WORKERGENID1.PIN=${HSM_PIN}

WORKERGENID1.ATTRIBUTES=\
    attributes(generate,CKO_PUBLIC_KEY,*) \= {\n   \
       CKA_TOKEN \= false\n   \
       CKA_ENCRYPT \= false\n   \
       CKA_VERIFY \= true\n   \
       CKA_WRAP \= false\n\
    }\n\
    attributes(generate, CKO_PRIVATE_KEY,*) \= {\n   \
       CKA_TOKEN \= true\n   \
       CKA_PRIVATE \= true\n   \
       CKA_SENSITIVE \= true\n   \
       CKA_EXTRACTABLE \= false\n   \
       CKA_DECRYPT \= false\n   \
       CKA_SIGN \= true\n   \
       CKA_UNWRAP \= false\n\
    }

# Alias da chave de teste/ativação — criada pelo provisioner se não existir.
WORKERGENID1.DEFAULTKEY=${SIGNER_KEY_ALIAS}
