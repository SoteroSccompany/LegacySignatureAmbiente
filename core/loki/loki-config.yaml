auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  http_server_read_timeout: 600s # 10 minutos para ler request
  http_server_write_timeout: 600s # 10 minutos para escrever response
  grpc_server_max_recv_msg_size: 104857600 # 100MB max message
  grpc_server_max_send_msg_size: 104857600

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Limites e retenção
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 720h # 7 dias
  retention_period: 1440h # 60 dias
  max_query_length: 1441h
  max_query_parallelism: 32
  # OTIMIZAÇÃO: Aumenta capacidade de ingestão para tempo real
  ingestion_rate_mb: 32 # MUDANÇA: 16 → 32 (suporta 2x mais logs/segundo)
  ingestion_burst_size_mb: 64 # MUDANÇA: 32 → 64 (suporta picos maiores sem perda)
  max_streams_per_user: 20000
  max_line_size: 0 # MUDANÇA: 256KB → 512KB (logs maiores não são truncados)
  max_entries_limit_per_query: 50000 # Permite queries com até 50k linhas
  max_query_series: 10000
  max_query_lookback: 1440h

# Compactor para limpeza automática
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Storage
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Query frontend
frontend:
  max_outstanding_per_tenant: 2048

# Query scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 1024

# Distributor
distributor:
  ring:
    kvstore:
      store: inmemory

# Ingester - OTIMIZADO PARA TEMPO REAL
ingester:
  max_chunk_age: 1h
  chunk_target_size: 10485760
  chunk_retain_period: 5s # MUDANÇA CRÍTICA: 30s → 5s (persiste 6x mais rápido)
  max_transfer_retries: 0
  # OTIMIZAÇÃO: Configurações adicionais para flush rápido
  chunk_idle_period: 5m # Flush chunks inativos após 5min
  chunk_block_size: 2097152 # Tamanho do bloco (256KB)
  chunk_encoding: snappy # Compressão rápida
  # WAL (Write-Ahead Log) para garantir que logs não sejam perdidos
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true # Garante flush ao desligar

# Table manager
table_manager:
  retention_deletes_enabled: true
  retention_period: 1440h # 60 dias
